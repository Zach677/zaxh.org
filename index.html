<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--META-SLOT-->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="zaxh" />
    <meta property="og:image" content="https://zaxh.org/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <script>
      ;(() => {
        var t = localStorage.getItem('app_theme')
        if (t !== 'system' && t !== 'light' && t !== 'dark') {
          t = 'system'
        }
        document.documentElement.dataset.theme = t
        // The book is prerendered open. It starts at its cover on the first
        // visit this session, unless the URL names a section.
        if (
          !sessionStorage.getItem('book-open') &&
          !/^#(work|about)$/.test(location.hash)
        ) {
          document.documentElement.dataset.book = 'closed'
        }
      })()
    </script>
    <link href="/src/style.css" rel="stylesheet" />
    <link rel="icon" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
